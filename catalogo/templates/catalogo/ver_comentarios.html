{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comentarios</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        .comentarios-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            font-family: Arial, sans-serif;
        }

        .comentarios-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
        }

        .comentario {
            padding: 16px;
            margin-bottom: 14px;
            background: #f9fafb;
            border-radius: 10px;
        }

        .comentario-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .comentario-header strong {
            color: #1f2937;
        }

        .comentario-header span {
            font-size: 12px;
            color: #6b7280;
        }

        .comentario p {
            margin: 0;
            color: #374151;
            line-height: 1.4;
        }

        .acciones {
            text-align: center;
            margin-top: 30px;
        }

        .acciones a {
            display: inline-block;
            margin: 0 6px;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            color: #fff;
            transition: 0.3s;
        }

        .btn-volver {
            background: #2563eb;
        }

        .btn-comentar {
            background: #10b981;
        }

        .acciones a:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .sin-comentarios {
            text-align: center;
            color: #6b7280;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="comentarios-container">

    <h2>Comentarios del producto</h2>

    {% for comentario in producto.comentarios.all %}
        <div class="comentario">
            <div class="comentario-header">
                <strong>{{ comentario.autor.username }}</strong>
                <span>{{ comentario.fecha|date:"d M Y H:i" }}</span>
            </div>
            <p>{{ comentario.mensaje }}</p>
        </div>
    {% empty %}
        <p class="sin-comentarios">Este producto aún no tiene comentarios.</p>
    {% endfor %}

    <div class="acciones">
        <a href="{% url 'home' %}" class="btn-volver">← Volver</a>
        <a href="{% url 'comentar' producto.id %}" class="btn-comentar">Comentar</a>
    </div>

</div>

</body>
</html>
